[workspace]
resolver = "3"
members = ["crates/pokesle-core", "crates/pokesle-ocr", "crates/pokesle-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = ""

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
rayon = "1.12"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
