name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースタグ（例: v0.1.0。空欄時は Cargo.toml の version から v<version> を使用）'
        required: false
        type: string
      prerelease:
        description: 'プレリリースとして公開する'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Release (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Determine release tag
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}".Trim()
          if ([string]::IsNullOrEmpty($tag)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $tag = "${{ github.ref_name }}"
            } else {
              $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
              if (-not $match) {
                throw "Cargo.toml から version を取得できませんでした"
              }
              $tag = "v$($match.Matches[0].Groups[1].Value)"
            }
          }

          $isPrerelease = ("${{ inputs.prerelease }}" -eq "true") -or ($tag -match '-')
          $assetName = "pokesle-$tag-windows-x86_64.zip"

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$($isPrerelease.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build -p pokesle-app --release --locked

      - name: Package release archive
        shell: pwsh
        run: |
          $stageDir = Join-Path $env:RUNNER_TEMP "pokesle-package"
          $outDir = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Force -Path $stageDir, $outDir | Out-Null

          Copy-Item "target/release/pokesle.exe" -Destination $stageDir
          Copy-Item "README.md" -Destination $stageDir
          Copy-Item "LICENSE" -Destination $stageDir
          Copy-Item "THIRD_PARTY_LICENSES.md" -Destination $stageDir

          $zipName = "${{ steps.meta.outputs.asset_name }}"
          $zipPath = Join-Path $outDir $zipName
          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipPath -Force

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "$zipPath.sha256" -Encoding ascii -NoNewline

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/release-assets/${{ steps.meta.outputs.asset_name }}
            ${{ runner.temp }}/release-assets/${{ steps.meta.outputs.asset_name }}.sha256
