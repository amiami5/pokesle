[package]
name = "pokesle-app"
description = "ポケスリシミュレーター(Rust 版) Windows アプリ"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pokesle"
path = "src/main.rs"

[dependencies]
pokesle-core = { path = "../pokesle-core" }
pokesle-ocr = { path = "../pokesle-ocr" }
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
egui_extras = { version = "0.36", default-features = false }
directories = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
skrifa = "0.44"

[build-dependencies]
winresource = "0.1"
